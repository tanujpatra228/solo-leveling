<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the System window can reach under the notch,
         and user-scalable is left alone: pinching a set log is legitimate. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070f" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Offline-first strength training as the System. Levels, stats, gates, and shadows on top of real progressive overload."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Solo Leveling System</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      The System requires JavaScript. Everything runs on your device, so there is nothing to load
      from a server, but there is nothing to run without it either.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
